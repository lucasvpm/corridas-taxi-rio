global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:3000"]

  - job_name: worker
    static_configs:
      - targets: ["worker:3001"]

  # Métricas agregadas do broker (memória, conexões, mensagens totais).
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  # Métricas POR FILA direto do broker. O alerta de fila usa esta fonte, e não o worker,
  # para continuar funcionando quando o worker está morto (que é justamente quando importa).
  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: ["queue_coarse_metrics", "queue_consumer_count"]
    static_configs:
      - targets: ["rabbitmq:15692"]
