apiVersion: v1
kind: Service
metadata:
  name: worker
spec:
  selector: { app: worker }
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  # Com KEDA (k8s/keda) o número de réplicas passa a ser controlado pelo tamanho da fila.
  replicas: 1
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: /metrics
    spec:
      # Tempo para terminar as mensagens em voo; o que não recebeu ack volta para a fila.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: worker
          image: corridas-worker:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef: { name: corridas-config }
          env:
            - name: PORT
              value: "3001"
            - name: AMQP_URL
              valueFrom: { secretKeyRef: { name: corridas-secrets, key: AMQP_URL } }
          startupProbe:
            httpGet: { path: /health/live, port: 3001 }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health/live, port: 3001 }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: 3001 }
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 300m, memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
