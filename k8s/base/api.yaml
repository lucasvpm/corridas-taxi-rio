apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: corridas-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: corridas-config }
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: corridas-secrets, key: DB_PASSWORD } }
            - name: AMQP_URL
              valueFrom: { secretKeyRef: { name: corridas-secrets, key: AMQP_URL } }
          volumeMounts:
            - name: jwt-public-key
              mountPath: /run/keys
              readOnly: true
          # startup: a API só abre a porta depois de conectar no MySQL (retry por até ~90s) e rodar
          # a migration; a janela de 150s evita que o pod seja morto enquanto o banco inicializa.
          startupProbe:
            httpGet: { path: /health/live, port: 3000 }
            periodSeconds: 2
            failureThreshold: 75
          # liveness não olha dependências: MySQL fora não deve causar restart em cascata.
          livenessProbe:
            httpGet: { path: /health/live, port: 3000 }
            periodSeconds: 10
            failureThreshold: 3
          # readiness tira o pod do Service se MySQL ou broker caírem.
          readinessProbe:
            httpGet: { path: /health/ready, port: 3000 }
            periodSeconds: 5
            failureThreshold: 2
          resources:
            # Medido no k6 (loadtest/RELATORIO.md): pico de 54% de 1 core e 330 MiB com tracing ligado.
            # CPU: request = uso em carga moderada (o que o scheduler reserva); o pico do k6 cabe no limit.
            #   Com request = pico (250m x 2 réplicas) os bancos ficaram Pending num nó de 2 vCPU.
            # Memória: não é compressível (estourar = OOMKill), então o request já cobre o pico.
            requests: { cpu: 100m, memory: 384Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: jwt-public-key
          configMap:
            name: jwt-public-key
            items:
              - key: jwt-public.pem
                path: jwt-public.pem
